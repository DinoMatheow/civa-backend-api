    spring.application.name=app



    spring.datasource.url=${CIVA_DB_URL}    
    spring.datasource.username=${CIVA_DB_USER}
    spring.datasource.password=${CIVA_DB_PASSWORD}
    spring.datasource.driver-class-name=org.postgresql.Driver
    spring.jpa.show-sql=true
    spring.jpa.hibernate.ddl-auto=create
    spring.jpa.properties.hibernate.format_sql=false
    jwt.secret=${JWT_SECRET_KEY}
    jwt.expiration=${JWT_EXPIRATION}



    logging.level.root=INFO
    logging.level.com.gestion.buses=DEBUG
    logging.level.org.springframework=INFO

    logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %highlight(%-5level) $cyan(%logger{36})  - %msg%n