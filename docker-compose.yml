version: '3.8' 

services:
  app:
    build: . 
    container_name: api-eventos-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${CIVA_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${CIVA_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${CIVA_DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      SPRING_PROFILES_ACTIVE: dev